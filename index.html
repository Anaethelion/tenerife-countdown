<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>Cap sur Ténérife</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap">
<style>
  /* Layout : affiche de voyage au crépuscule. Le compte à rebours occupe le ciel, le Teide émerge de la mer de nuages en bas. */
  :root {
    color-scheme: dark;
    --night: #17163f;
    --dusk: #5b2a6e;
    --coral: #e8506a;
    --ember: #ff9a3c;
    --sun: #ffe08a;
    --lava: #170f22;
    --cloud: #f6cfc6;
    --ink: #fff6ea;
    --ink-soft: rgba(255, 246, 234, .78);
    --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    height: auto;
    background: linear-gradient(180deg, var(--night) 0%, var(--dusk) 38%, var(--coral) 66%, var(--ember) 88%, var(--sun) 100%) var(--night);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1rem;
    overflow-x: hidden;
    position: relative;
  }
  #stars { position: absolute; inset: 0 0 auto 0; width: 100%; height: 55%; pointer-events: none; }

  main {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1rem, 3vh, 2rem);
    padding-block: clamp(1.5rem, 6vh, 4rem) 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
  }
  .eyebrow {
    margin: 0;
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--sun);
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(2.6rem, 9vw, 5.5rem);
    line-height: .95;
    letter-spacing: .01em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  .when { margin: 0; color: var(--ink-soft); font-weight: 500; }

  .clock {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: clamp(.4rem, 2vw, 1.5rem);
    width: min(100%, 46rem);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .clock li { display: flex; flex-direction: column; align-items: center; gap: .1rem; min-width: 0; }
  .num {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(3.4rem, 17vw, 9.5rem);
    line-height: .9;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 .04em 0 rgba(23, 15, 34, .35);
  }
  .unit {
    font-size: clamp(.65rem, 2.4vw, .85rem);
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .dodos { margin: 0; font-size: 1.1rem; font-weight: 500; }
  .dodos b { color: var(--sun); font-weight: 700; }

  .route { width: min(100%, 34rem); display: flex; flex-direction: column; gap: .5rem; }
  .track {
    position: relative;
    height: 1.75rem;
    background: repeating-linear-gradient(90deg, var(--ink-soft) 0 6px, transparent 6px 14px) center / 100% 2px no-repeat;
  }
  .plane {
    position: absolute;
    top: 50%;
    left: 0;
    width: 1.75rem;
    height: 1.75rem;
    transform: translate(-50%, -50%);
    fill: var(--sun);
    filter: drop-shadow(0 2px 3px rgba(23, 15, 34, .5));
    animation: bob 3s ease-in-out infinite;
  }
  .ends { display: flex; justify-content: space-between; gap: 1rem; font-size: .8rem; color: var(--ink-soft); font-weight: 500; }

  .facts {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .4rem 1.25rem;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: .85rem;
    color: var(--ink);
  }
  .facts b { font-family: var(--display); font-size: 1.15rem; letter-spacing: .03em; margin-right: .3em; }

  .scene { position: relative; z-index: 1; flex: 1 0 auto; min-height: clamp(180px, 34vh, 380px); margin-top: -1rem; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sun-disc { fill: var(--sun); }
  .sun-halo { fill: var(--sun); opacity: .22; }
  .teide { fill: var(--lava); }
  .ridge { fill: var(--dusk); opacity: .55; }
  .clouds-back { fill: var(--cloud); opacity: .55; animation: drift 60s linear infinite alternate; }
  .clouds-front { fill: var(--cloud); animation: drift 40s linear infinite alternate-reverse; }

  @keyframes bob { 50% { transform: translate(-50%, -62%); } }
  @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
  @media (prefers-reduced-motion: reduce) {
    .plane, .clouds-back, .clouds-front { animation: none; }
  }
</style>

<canvas id="stars" aria-hidden="true"></canvas>

<main>
  <p class="eyebrow">Islas Canarias</p>
  <h1 id="headline">Cap sur Ténérife</h1>
  <p class="when">Décollage dimanche 27 décembre 2026 à 11h00</p>

  <ul class="clock" aria-live="off">
    <li><span class="num" id="d">--</span><span class="unit" id="ud">jours</span></li>
    <li><span class="num" id="h">--</span><span class="unit" id="uh">heures</span></li>
    <li><span class="num" id="m">--</span><span class="unit" id="um">minutes</span></li>
    <li><span class="num" id="s">--</span><span class="unit" id="us">secondes</span></li>
  </ul>

  <p class="dodos" id="dodos">&nbsp;</p>

  <div class="route" aria-hidden="true">
    <div class="track">
      <svg class="plane" id="plane" viewBox="0 0 24 24"><path d="M22 12c0-.8-.7-1.5-1.5-1.5H15L10 3H8l2.5 7.5H5L3.5 8.5H2L3 12l-1 3.500h1.500L5 13.500h5.500L8 21h2l5-7.500h5.500c.8 0 1.500-.7 1.500-1.500z"/></svg>
    </div>
    <div class="ends"><span>24 nov.</span><span>TFS · 27 déc.</span></div>
  </div>

  <ul class="facts">
    <li><b>3 715 m</b>le Teide</li>
    <li><b>28° N</b>latitude</li>
    <li><b>≈ 21 °C</b>fin décembre</li>
    <li><b>UTC+0</b>une heure de moins</li>
  </ul>
</main>

<div class="scene" aria-hidden="true">
  <svg viewBox="0 0 1200 420" preserveAspectRatio="xMidYMax slice">
    <circle class="sun-halo" cx="840" cy="250" r="150"/>
    <circle class="sun-disc" cx="840" cy="250" r="78"/>
    <path class="ridge" d="M0 420V300c120-20 230-30 330-70 60-24 110-10 170 20 120 60 300 70 700 90v80z"/>
    <path class="clouds-back" d="M-60 420v-90c40-30 90-30 130-8 30-34 90-40 130-10 40-28 100-24 132 8 44-30 104-26 140 6 36-34 100-36 140-4 40-30 96-28 132 4 40-32 104-30 142 4 38-30 96-28 130 2 36-26 84-26 124 0v88z"/>
    <path class="teide" d="M0 420v-70c150-18 290-62 410-118 62-30 104-72 146-122l28-32c12-14 34-16 48-2l30 30c44 44 90 62 150 82 110 38 250 90 388 112v120z"/>
    <path class="clouds-front" d="M-60 420v-50c36-26 84-26 120-4 34-30 88-32 126-4 40-30 100-28 136 4 40-28 96-26 130 4 38-30 98-30 136 2 36-28 92-28 128 2 40-30 100-28 136 4 38-28 92-26 126 4 36-24 80-24 122 0v38z"/>
  </svg>
</div>

<script>
  const target = new Date(2026, 11, 27, 11, 0, 0);
  const start = new Date(2026, 10, 24, 0, 0, 0);
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const plural = (n, w) => n > 1 ? w + "s" : w;
  const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());

  function tick() {
    const now = new Date();
    let left = Math.max(0, target - now);
    const total = Math.floor(left / 1000);
    const d = Math.floor(total / 86400);
    const h = Math.floor(total % 86400 / 3600);
    const m = Math.floor(total % 3600 / 60);
    const s = total % 60;

    $("d").textContent = d;
    $("h").textContent = pad(h);
    $("m").textContent = pad(m);
    $("s").textContent = pad(s);
    $("ud").textContent = plural(d, "jour");
    $("uh").textContent = plural(h, "heure");
    $("um").textContent = plural(m, "minute");
    $("us").textContent = plural(s, "seconde");

    const progress = Math.min(1, Math.max(0, (now - start) / (target - start)));
    $("plane").style.left = (progress * 100) + "%";

    if (left === 0) {
      $("headline").textContent = "C'est parti !";
      $("dodos").innerHTML = "Bon vol, et à nous le <b>soleil</b>.";
      return;
    }
    const nights = Math.round((midnight(target) - midnight(now)) / 864e5);
    $("dodos").innerHTML = nights === 0
      ? "C'est <b>aujourd'hui</b>. Les valises sont prêtes ?"
      : "Encore <b>" + nights + " " + plural(nights, "dodo") + "</b> avant le soleil.";
  }
  tick();
  setInterval(tick, 1000);

  // Étoiles, tirage fixe pour que le ciel ne change pas à chaque visite
  const cv = $("stars");
  function stars() {
    const r = Math.min(window.devicePixelRatio || 1, 2);
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * r; cv.height = h * r;
    const ctx = cv.getContext("2d");
    ctx.scale(r, r);
    let seed = 27122026;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 110; i++) {
      const y = rnd() * rnd() * h;
      ctx.globalAlpha = (1 - y / h) * (.35 + rnd() * .65);
      ctx.fillStyle = "#fff6ea";
      ctx.beginPath();
      ctx.arc(rnd() * w, y, .4 + rnd() * 1.1, 0, 6.3);
      ctx.fill();
    }
  }
  stars();
  window.addEventListener("resize", stars);
</script>
</html>
